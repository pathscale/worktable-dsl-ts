name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubicloud-standard-2
    env:
      # The tests spawn `worktable-parse` and `worktable-schemas` from a WorkTable checkout.
      # actions/checkout refuses a path outside GITHUB_WORKSPACE, so the sibling lives inside it
      # and is pointed at by environment variable rather than by reproducing a directory layout
      # with symlinks.
      WORKTABLE_RS: ${{ github.workspace }}/siblings/WorkTable
    steps:
      - uses: actions/checkout@v4

      # The `dsl` crate is not on WorkTable's default branch: it lives on the release branch,
      # so checking out `master` gets a workspace that does not contain `worktable_dsl` at all.
      # WORKTABLE_REF overrides it from repository settings when that changes, without a commit
      # here.
      #
      # A WorkTable branch of the same name as this pull request's is preferred when one
      # exists. The language and this emitter are separate repositories, so a change that
      # touches the grammar and the emitter is two pull requests, and testing the new emitter
      # against the old grammar tests nothing.
      - name: Checkout WorkTable
        uses: actions/checkout@v4
        with:
          repository: pathscale/WorkTable
          ref: ${{ vars.WORKTABLE_REF || 'release/beta17' }}
          path: siblings/WorkTable

      - name: Prefer a WorkTable branch matching this one
        working-directory: siblings/WorkTable
        run: |
          branch="${{ github.head_ref }}"
          if [ -n "$branch" ] && git fetch --depth 1 origin "$branch" 2>/dev/null; then
            git checkout --detach FETCH_HEAD
            echo "WorkTable: $branch"
          else
            echo "WorkTable: ${{ vars.WORKTABLE_REF || 'release/beta17' }}"
          fi

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: siblings/WorkTable

      - run: bun install --frozen-lockfile || bun install

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun test
