name: Release

# Publishing uses npm Trusted Publishing (OIDC), so no NPM_TOKEN exists in this repository.
# It needs one-time setup on npmjs.com:
#
#   @pathscale/worktable-dsl -> Settings -> Trusted Publisher -> GitHub Actions
#   repository: pathscale/worktable-dsl-ts, workflow: release.yml
#
# Without it the publish step fails closed rather than publishing unauthenticated. npm requires
# a package to exist before a trusted publisher can be configured, which is why 0.1.0 was
# published by hand; every version after it comes from here, with no credential anywhere.
#
# The version is whatever package.json says. A release is deliberate: bump the version in a
# commit and push, and this ships it. Pushing without a bump publishes nothing.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubicloud-standard-2
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: decide
        run: |
          current="$(node -p "require('./package.json').version")"
          echo "version=$current" >> "$GITHUB_OUTPUT"
          if npm view "@pathscale/worktable-dsl@$current" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$current is already on npm — nothing to do"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::publishing $current"
          fi

  prepare:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubicloud-standard-2
    env:
      WORKTABLE_RS: ${{ github.workspace }}/siblings/WorkTable
    steps:
      - uses: actions/checkout@v4

      # Match the 1.9 alpha grammar in WorkTable PR 105. The previous repository
      # variable pointed at an older emitter branch and missed this release's schema.
      # Move this ref to master after PR 105 lands.
      #
      # A WorkTable branch of the same name as this pull request's is preferred when one
      # exists. The language and this emitter are separate repositories, so a change that
      # touches the grammar and the emitter is two pull requests, and testing the new emitter
      # against the old grammar tests nothing.
      - name: Checkout WorkTable
        uses: actions/checkout@v4
        with:
          repository: pathscale/WorkTable
          ref: feat/runtime-backends
          path: siblings/WorkTable

      - name: Prefer a WorkTable branch matching this one
        working-directory: siblings/WorkTable
        env:
          MATCHING_BRANCH: ${{ github.head_ref }}
        run: |
          branch="$MATCHING_BRANCH"
          if [ -n "$branch" ] && git fetch --depth 1 origin "$branch" 2>/dev/null; then
            git checkout --detach FETCH_HEAD
            echo "WorkTable: $branch"
          else
            echo "WorkTable: feat/runtime-backends"
          fi

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: siblings/WorkTable

      - run: bun install

      # Gates before the tarball exists. A version can never be reused, so everything that can
      # fail must fail before anything ships.
      - run: bun run typecheck
      - run: bun run build

      # Every declaration in WorkTable, emitted here and compared against Schema::to_dsl().
      - run: bun test

      # Exercises what actually ships rather than the source tree.
      - run: bun run smoke

      - name: publint (publish config, exports, file paths)
        run: npx --yes publint --strict

      - name: Pack
        run: |
          mkdir -p release
          npm pack --pack-destination release

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error

  publish:
    needs: [decide, prepare]
    # GitHub-hosted, not Ubicloud: npm provenance attestation requires it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require npm with OIDC support
        run: |
          npm_version="$(npm --version)"
          node -e '
            const [major, minor, patch = 0] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1);
          ' "$npm_version" || {
            echo "npm 11.5.1 or newer is required for Trusted Publishing; found $npm_version"
            exit 1
          }
      - name: Publish to npm
        run: npm publish ./release/*.tgz --access public

  tag:
    needs: [decide, publish]
    runs-on: ubicloud-standard-2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" \
            --generate-notes
